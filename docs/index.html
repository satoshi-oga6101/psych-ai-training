<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 著者名は検索の入口になるので title / byline の両方に置く。
       script.js の AUTHOR 定数にも同じ名前があるので、変わったら両方直す。 -->
  <title>AI心理面接演習教材サイト｜緒賀 郷志</title>
  <meta name="description" content="緒賀 郷志の書籍で紹介した心理臨床のAI演習プロンプト88本。ChatGPT・Claude・Geminiにコピーして使える教材サイト。" />

  <!-- SNS共有カード（OGP）。URLは絶対パスでないと効かない。
       1ページ構成なので、演習ごとのディープリンクを共有しても同じカードが出る。
       画像を差し替えるときは各SNSのキャッシュが残るのでファイル名を変える。 -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="AI心理面接演習教材サイト" />
  <meta property="og:locale" content="ja_JP" />
  <meta property="og:url" content="https://satoshi-oga6101.github.io/psych-ai-training/" />
  <meta property="og:title" content="AI心理面接演習教材サイト｜緒賀 郷志" />
  <meta property="og:description" content="緒賀 郷志の書籍で紹介した心理臨床のAI演習プロンプト88本。ChatGPT・Claude・Geminiにコピーして使える教材サイト。" />
  <meta property="og:image" content="https://satoshi-oga6101.github.io/psych-ai-training/assets/ogp.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="AI心理面接演習教材サイト｜緒賀 郷志" />
  <!-- X は twitter:image が無ければ og:image を使うので、画像は1枚でよい -->
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <div>
        <h1>AI心理面接演習教材サイト</h1>
        <p class="tagline">生成AIを「演習の実行環境」として使うためのプロンプト教材</p>
        <p class="byline">緒賀 郷志</p>
      </div>
      <div class="site-header__tools">
        <button id="show-guide" class="guide-btn" type="button">使い方</button>
        <input id="search" class="search" type="search" placeholder="キーワードで演習を検索" aria-label="演習を検索" />
      </div>
    </div>
  </header>

  <div id="app" class="app">
    <!-- 左：ナビ＋フィルタ -->
    <aside class="pane pane--nav" aria-label="ナビゲーション">
      <div class="axis-toggle" role="tablist" aria-label="探し方">
        <button id="axis-book" class="axis-toggle__btn is-active" role="tab" aria-selected="true">書籍で探す</button>
        <button id="axis-skill" class="axis-toggle__btn" role="tab" aria-selected="false">スキルで探す</button>
      </div>
      <nav id="nav-list" class="nav-list" aria-label="一覧"></nav>

      <div class="filters">
        <h2 class="filters__title">絞り込み</h2>
        <div class="filter-group">
          <span class="filter-group__label">AIの役割</span>
          <div id="filter-roles" class="chip-row"></div>
        </div>
        <div class="filter-group">
          <span class="filter-group__label">実行モード</span>
          <div id="filter-modes" class="chip-row"></div>
        </div>
        <div id="filter-types-group" class="filter-group" hidden>
          <span class="filter-group__label">演習タイプ</span>
          <div id="filter-types" class="chip-row"></div>
        </div>
        <button id="clear-filters" class="clear-btn" type="button">絞り込みを解除</button>
      </div>
    </aside>

    <!-- 中央：演習一覧 -->
    <section class="pane pane--list" aria-label="演習一覧">
      <div id="list-summary" class="list-summary" aria-live="polite"></div>
      <ul id="exercise-list" class="exercise-list"></ul>
    </section>

    <!-- 右：演習詳細 -->
    <section class="pane pane--detail" aria-label="演習詳細">
      <div id="detail" class="detail"></div>
    </section>
  </div>

  <footer class="site-footer">
    <p>登場人物はすべて架空です。実在するクライエントの情報は入力しないでください。生成AIの応答は学習用のシミュレーションであり、臨床判断・診断・スーパービジョンの代替ではありません。</p>
    <p class="site-footer__license">
      © 2026 緒賀 郷志 — Licensed under
      <a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>
      <span class="site-footer__sep">／</span>
      営利目的での利用は
      <a href="https://note.com/oga_satoshi/message" target="_blank" rel="noopener">お問い合わせ</a>
      ください
    </p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
